<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, intial-scale="1.0">
    <title>Product Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="page-header">
        <h1>Product Showcase Page</h1>
        <p>Please have a look at our exclusive product selection.</p>
    </header>

<main class="product-grid">

    <div class="container">
        <div class="products">
            <img src="https://via.placeholder.com/300x200">
            <h2>Wireless Headphones</h2>
            <p class="price-tag">$39.99</p>
            <button class="add-to-cart">Add to Cart</button>
        </div>

        <div class="products">
            <img src="https://via.placeholder.com/300x200">
            <h2>Wireless Mouse</h2>
            <p class="price-tag">$19.99</p>
            <button class="add-to-cart">Add to Cart</button>
        </div>

        <div class="products">
            <img src="https://via.placeholder.com/300x200">
            <h2>Wireless Keyboard</h2>
            <p class="price-tag">$34.99</p>
            <button class="add-to-cart">Add to Cart</button>
        </div>

        <div class="products">
            <img src="https://via.placeholder.com/300x200">
            <h2>Mousepad</h2>
            <p class="price-tag">$14.99</p>
            <button class="add-to-cart">Add to Cart</button>
        </div>

        <div class="products">
            <img src="https://via.placeholder.com/300x200">
            <h2>32" Monitor</h2>
            <p class="price-tag">$49.99</p>
            <button class="add-to-cart">Add to Cart</button>
        </div>

        <div class="products">
            <img src="https://via.placeholder.com/300x200">
            <h2>Gaming Chair</h2>
            <p class="price-tag">$79.99</p>
            <button class="add-to-cart">Add to Cart</button>
        </div>
    </div>
</main>
</body>
</html>
